name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: electricos
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: electricos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U electricos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ_LOCAL: America/Montevideo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias (tarifas, potencia, facturación, seguridad, consumo)
        run: npm test -w server
      - name: Pruebas de la API contra PostgreSQL
        run: npm run test:api -w server
        env:
          TEST_DATABASE_URL: postgres://electricos:prueba@localhost:5432/electricos_test
      - name: Compilar el panel web
        run: npm run build
